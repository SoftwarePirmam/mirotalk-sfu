<!doctype html>
<html lang="en" class="no-js">
    <head>
        <title id="title">Syncroom - Create account</title>
        <link id="icon" rel="shortcut icon" href="../images/logo.svg" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/logo.svg" />
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans:400,600" />
        <link rel="stylesheet" type="text/css" href="../css/landing.css" />
        <link rel="stylesheet" type="text/css" href="../css/login.css" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
        <script defer src="../js/Brand.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.8"></script>
        <script defer src="../js/Swal.js"></script>
        <link rel="stylesheet" href="../css/Swal.css" />
        <script defer src="../js/Register.js"></script>
    </head>
    <body class="is-boxed has-animations">
        <div class="body-wrap">
            <header class="site-header reveal-from-top">
                <div class="container">
                    <div class="site-header-inner">
                        <div class="brand header-brand">
                            <h1 class="m-0">
                                <a href="/">
                                    <img id="headerLogo" src="../images/logo.svg" alt="Syncroom" width="32" height="32" />
                                </a>
                            </h1>
                        </div>
                    </div>
                </div>
            </header>
            <main class="site-content">
                <section class="hero section center-card-section">
                    <div class="container">
                        <div class="hero-inner">
                            <div class="login-card reveal-from-bottom" data-reveal-delay="150">
                                <div class="login-form-section" role="form" aria-label="Register">
                                    <div class="login-icon">
                                        <i class="fa-solid fa-user-plus"></i>
                                    </div>
                                    <h2 class="login-title">Create your Syncroom account</h2>
                                    <p class="login-description">Manage meetings, calendar, and rooms in one place.</p>
                                    <div class="login-input-group">
                                        <i class="fa-solid fa-signature"></i>
                                        <input
                                            id="displayName"
                                            class="form-input"
                                            type="text"
                                            placeholder="Display name"
                                            maxlength="80"
                                            autocomplete="name"
                                            required
                                        />
                                    </div>
                                    <div class="login-input-group">
                                        <i class="fa-solid fa-envelope"></i>
                                        <input
                                            id="email"
                                            class="form-input"
                                            type="email"
                                            placeholder="Email"
                                            maxlength="254"
                                            autocomplete="email"
                                            required
                                        />
                                    </div>
                                    <div class="login-input-group">
                                        <i class="fa-solid fa-key"></i>
                                        <input
                                            id="password"
                                            class="form-input"
                                            type="password"
                                            placeholder="Password (min 8 chars)"
                                            maxlength="128"
                                            autocomplete="new-password"
                                            required
                                        />
                                    </div>
                                    <div
                                        id="registerError"
                                        class="login-error"
                                        role="alert"
                                        aria-live="polite"
                                        hidden
                                    >
                                        <i class="fa-solid fa-circle-exclamation"></i>
                                        <span id="registerErrorText"></span>
                                    </div>
                                    <button id="registerButton" class="login-btn pulse" type="button">
                                        <span id="registerBtnText"
                                            ><i class="fa-solid fa-user-plus"></i>&nbsp; Create account</span
                                        >
                                        <span id="registerBtnLoader" class="login-btn-loader">
                                            <i class="fa-solid fa-circle-notch fa-spin"></i>&nbsp; Creating...
                                        </span>
                                    </button>
                                    <p class="login-description mt-3 mb-0">
                                        Already have an account? <a href="/login">Sign in</a>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </body>
</html>
